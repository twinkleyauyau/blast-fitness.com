:root{--paper:#EFEEEB;--ink:#0A0A0A;--smoke:#767470;--spark:#FF4D00;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:300;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;-webkit-font-smoothing:antialiased}
.logo{height:26px;margin-bottom:56px;opacity:.9}
.code{font-family:var(--slab);font-size:clamp(96px,22vw,220px);line-height:.9;letter-spacing:.02em}
.code span{color:var(--spark)}

p{color:#b8b7b3;font-size:15px;line-height:1.9;max-width:38ch;margin:0 auto 40px}
.act{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;font-family:var(--mono);font-size:13px;letter-spacing:.08em;padding:15px 30px;
  border:1px solid var(--paper);transition:background .2s,color .2s,transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn--fill{background:var(--spark);border-color:var(--spark);color:#fff}
.btn--fill:hover{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.btn--line{color:var(--paper)}
.btn--line:hover{background:var(--paper);color:var(--ink)}
a{text-decoration:none;color:inherit}
</style>
